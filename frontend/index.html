<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf5" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const key = "bom-investidor.theme";
        let theme;
        try {
          const stored = window.localStorage.getItem(key);
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {
          // O fallback abaixo mantém a aplicação utilizável.
        }
        if (!theme) {
          try {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } catch {
            theme = "light";
          }
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#11100f" : "#fffaf5");
      })();
    </script>
    <meta
      name="description"
      content="Gestão inteligente de carteiras de investimentos"
    />
    <title>Bom Investidor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
