schema: spec-driven

context: |
  Produto: API REST para gestão de carteiras de ações e corretoras.
  Requisitos globais: docs/product-spec.md.
  Stack: Java 17, Spring Boot, Maven, H2 para desenvolvimento e PostgreSQL para produção.
  Arquitetura: Domain, Mapper, Controller, Service, Repository, Entity e DTO.
  Padrões principais: Strategy para integrações externas e State para o ciclo de vida dos lançamentos.
  APIs devem retornar JSON e utilizar tratamento centralizado de erros com @ControllerAdvice.
  Antes de criar artefatos que envolvam requisitos do produto, consulte docs/product-spec.md.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
