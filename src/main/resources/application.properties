spring.application.name=bom-investidor
spring.profiles.default=dev
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
springdoc.swagger-ui.path=/swagger-ui.html
app.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}

app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

app.integrations.brasil-api-base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}
app.integrations.via-cep-base-url=${VIA_CEP_BASE_URL:https://viacep.com.br}
app.integrations.cvm-snapshot-url=${CVM_SNAPSHOT_URL:https://dados.cvm.gov.br/dados/INTERMED/CAD/DADOS/cad_intermed.zip}
app.integrations.connect-timeout=${INTEGRATIONS_CONNECT_TIMEOUT:PT3S}
app.integrations.read-timeout=${INTEGRATIONS_READ_TIMEOUT:PT5S}
app.integrations.cvm-cache-ttl=${CVM_CACHE_TTL:PT24H}
app.integrations.cvm-active-status=${CVM_ACTIVE_STATUS:EM FUNCIONAMENTO NORMAL}
app.integrations.cvm-max-snapshot-bytes=${CVM_MAX_SNAPSHOT_BYTES:10000000}
app.integrations.brapi-base-url=${BRAPI_BASE_URL:https://brapi.dev}
app.integrations.brapi-token=${BRAPI_TOKEN:}
app.integrations.twelve-data-base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
app.integrations.twelve-data-api-key=${TWELVE_DATA_API_KEY:}
app.integrations.alpha-vantage-base-url=${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
app.integrations.alpha-vantage-api-key=${ALPHA_VANTAGE_API_KEY:}
app.integrations.asset-search-cache-ttl=${ASSET_SEARCH_CACHE_TTL:PT5M}
app.integrations.asset-quote-cache-ttl=${ASSET_QUOTE_CACHE_TTL:PT1M}
app.integrations.exchange-rate-cache-ttl=${EXCHANGE_RATE_CACHE_TTL:PT1H}
app.integrations.income-candidate-cache-ttl=${INCOME_CANDIDATE_CACHE_TTL:PT10M}
app.integrations.income-provider-cache-ttl=${INCOME_PROVIDER_CACHE_TTL:PT30M}
app.integrations.income-provider-stale-ttl=${INCOME_PROVIDER_STALE_TTL:PT6H}
app.integrations.historical-price-window-days=${HISTORICAL_PRICE_WINDOW_DAYS:90}
app.integrations.historical-price-cache-ttl=${HISTORICAL_PRICE_CACHE_TTL:PT15M}
